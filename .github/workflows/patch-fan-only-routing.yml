name: Apply fan-only routing hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-fan-only-routing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch auxiliary HVAC routing
        shell: python
        run: |
          from pathlib import Path

          mpc = Path("custom_components/roommind/control/mpc_controller.py")
          text = mpc.read_text(encoding="utf-8")

          old = '''        # Store targets for _call delegation (setback idle_action) — must be
          # after backward-compat conversion so legacy callers get a TargetTemps.
          self._idle_targets = targets
          self._force_off = force_off
'''
          new = '''        # Auxiliary AC modes are intentionally non-thermal.  The coordinator
          # keeps the room in MODE_IDLE, but the selected AC must not be idled/off
          # before fan_only/dry is routed by room_climate.async_apply_ac_auxiliary_mode.
          requested_hvac_mode = self.room_config.get("room_hvac_mode")
          keep_fan_on_window_open = self.room_config.get("keep_fan_only_on_window_open", True)
          auxiliary_mode_allowed = (
              (requested_hvac_mode == "dry" and not window_open)
              or (
                  requested_hvac_mode == "fan_only"
                  and (not window_open or keep_fan_on_window_open)
              )
          )
          if auxiliary_mode_allowed:
              force_off = False

          # Store targets for _call delegation (setback idle_action) — must be
          # after backward-compat conversion so legacy callers get a TargetTemps.
          self._idle_targets = targets
          self._force_off = force_off
'''
          if old not in text:
              raise SystemExit("mpc_controller.py: target block 1 not found")
          text = text.replace(old, new, 1)

          old = '''        _exclude = exclude_eids or set()
          thermostats = [e for e in self.thermostats if e not in _exclude]
'''
          new = '''        _exclude = set(exclude_eids or set())
          if auxiliary_mode_allowed:
              _exclude.update(self.acs)
          thermostats = [e for e in self.thermostats if e not in _exclude]
'''
          if old not in text:
              raise SystemExit("mpc_controller.py: target block 2 not found")
          text = text.replace(old, new, 1)

          old = '''        elif mode == MODE_IDLE:
          for eid in thermostats + self.acs:
'''
          new = '''        elif mode == MODE_IDLE:
          idle_acs = [e for e in self.acs if e not in _exclude]
          for eid in thermostats + idle_acs:
'''
          if old not in text:
              raise SystemExit("mpc_controller.py: target block 3 not found")
          text = text.replace(old, new, 1)
          mpc.write_text(text, encoding="utf-8")

          room_climate = Path("custom_components/roommind/managers/room_climate.py")
          text = room_climate.read_text(encoding="utf-8")
          old = '''    entity_id = acs[0]
          mode = room.get("room_hvac_mode")
          if mode in ("dry", "fan_only"):
'''
          new = '''    entity_id = acs[0]
          mode = room.get("room_hvac_mode")

          # Window pause blocks compressor-backed auxiliary modes such as dry,
          # while fan_only may keep circulating air (default enabled).
          window_open = any(
              (state := hass.states.get(sensor_id)) is not None and state.state == "on"
              for sensor_id in room.get("window_sensors", [])
          )
          if window_open and mode == "dry":
              return
          if window_open and mode == "fan_only" and not room.get("keep_fan_only_on_window_open", True):
              return

          if mode in ("dry", "fan_only"):
'''
          if old not in text:
              raise SystemExit("room_climate.py: target block not found")
          text = text.replace(old, new, 1)
          room_climate.write_text(text, encoding="utf-8")

          # One-shot workflow: remove itself from the resulting hotfix commit.
          Path(".github/workflows/patch-fan-only-routing.yml").unlink()

      - name: Validate syntax
        run: python -m compileall -q custom_components/roommind/control/mpc_controller.py custom_components/roommind/managers/room_climate.py

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: route fan-only without cycling AC off"
          git push origin HEAD:main
