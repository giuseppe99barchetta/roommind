name: Run fan-only climate UI fix

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_fan_only_ui_fix.py
      - .github/workflows/run-fan-only-ui-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python scripts/apply_fan_only_ui_fix.py
      - name: Validate Python
        run: python -m compileall -q custom_components/roommind tests
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run focused climate tests
        run: pytest -q tests/test_climate.py
      - name: Commit result
        run: |
          rm .github/workflows/run-fan-only-ui-fix.yml scripts/apply_fan_only_ui_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: hide temperature target in fan-only mode"
          git push origin HEAD:main
