name: Revert manual climate guard
on:
  push:
    branches: [main]
    paths:
      - scripts/revert_manual_climate_guard.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply correction
        run: python scripts/revert_manual_climate_guard.py
      - name: Validate
        run: python -m compileall -q custom_components/roommind
      - name: Commit result
        run: |
          rm .github/workflows/revert-manual-climate-guard.yml scripts/revert_manual_climate_guard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: allow manual RoomMind climate commands when automation is disabled"
          git push origin HEAD:main
