name: Run fan-only semantics fix

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_fan_only_semantics_fix.py
      - .github/workflows/run-fan-only-semantics-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python scripts/apply_fan_only_semantics_fix.py
      - name: Validate Python
        run: python -m compileall -q custom_components/roommind tests
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run focused tests
        run: pytest -q tests/coordinator/test_window_pause.py tests/test_climate.py
      - name: Commit result
        run: |
          rm .github/workflows/run-fan-only-semantics-fix.yml scripts/apply_fan_only_semantics_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve manual fan-only without restoring it"
          git push origin HEAD:main
