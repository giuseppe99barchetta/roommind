name: Run climate control flow cleanup

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_control_flow_cleanup.py
      - .github/workflows/run-control-flow-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply cleanup patch
        run: python scripts/apply_control_flow_cleanup.py
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run focused tests
        run: pytest tests/test_climate.py tests/managers/test_valve_manager.py tests/test_control_flow_cleanup.py -q
      - name: Ruff changed Python
        run: |
          ruff check custom_components/roommind/climate.py custom_components/roommind/coordinator.py custom_components/roommind/control/mpc_controller.py custom_components/roommind/managers/boiler_manager.py custom_components/roommind/managers/valve_manager.py tests/test_control_flow_cleanup.py
          ruff format --check custom_components/roommind/climate.py custom_components/roommind/coordinator.py custom_components/roommind/control/mpc_controller.py custom_components/roommind/managers/boiler_manager.py custom_components/roommind/managers/valve_manager.py tests/test_control_flow_cleanup.py
      - name: Type check
        run: mypy custom_components/roommind/
      - name: Frontend package check
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Commit result
        run: |
          rm scripts/apply_control_flow_cleanup.py .github/workflows/run-control-flow-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: unify climate control flow and manual safety"
          git push
