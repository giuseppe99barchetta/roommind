name: Run manual climate refactor
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-manual-climate-refactor.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply refactor
        run: python scripts/apply_manual_climate_refactor.py
      - name: Validate Python
        run: python -m compileall -q custom_components/roommind tests
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run focused tests
        run: pytest -q tests/test_climate.py tests/coordinator/test_window_pause.py
      - name: Commit result
        run: |
          rm .github/workflows/run-manual-climate-refactor.yml scripts/apply_manual_climate_refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: separate manual climate control from automation"
          git push origin HEAD:main
