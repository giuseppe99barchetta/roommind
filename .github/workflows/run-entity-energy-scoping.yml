name: Validate entity energy scoping
on:
  push:
    branches: [fix/entity-energy-scoping]
    paths:
      - scripts/apply_entity_energy_scoping.py
      - .github/workflows/run-entity-energy-scoping.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/entity-energy-scoping
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_entity_energy_scoping.py
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Format and lint
        run: |
          ruff format custom_components/roommind tests
          ruff check --fix custom_components/roommind tests
          ruff check custom_components/roommind tests
      - name: Test
        run: pytest -q
      - name: Type check
        run: mypy custom_components/roommind
      - name: Commit result
        run: |
          rm scripts/apply_entity_energy_scoping.py
          rm .github/workflows/run-entity-energy-scoping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: scope energy entities and normalize room names"
          git push origin HEAD:fix/entity-energy-scoping
