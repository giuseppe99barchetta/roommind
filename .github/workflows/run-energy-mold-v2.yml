name: Run energy learning and mold prevention v2

on:
  push:
    branches: [energy-mold-v2]
    paths:
      - scripts/apply_energy_mold_v2.py
      - scripts/apply_energy_mold_v2_corrections.py
      - .github/workflows/run-energy-mold-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: energy-mold-v2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: |
          python scripts/apply_energy_mold_v2.py
          python scripts/apply_energy_mold_v2_corrections.py
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Format changed Python
        run: |
          ruff format custom_components/roommind tests
      - name: Run tests
        run: pytest -q
      - name: Ruff
        run: ruff check custom_components/roommind tests
      - name: Type check
        run: mypy custom_components/roommind
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit result
        run: |
          rm scripts/apply_energy_mold_v2.py
          rm scripts/apply_energy_mold_v2_corrections.py
          rm .github/workflows/run-energy-mold-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: learn AC energy use and improve mold prevention"
          git push origin HEAD:energy-mold-v2
