name: Validate RoomMind current humidity
on:
  push:
    branches: [fix/homekit-current-humidity]
    paths:
      - scripts/apply_current_humidity.py
      - .github/workflows/run-current-humidity.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homekit-current-humidity
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_current_humidity.py
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Format and lint
        run: |
          ruff format custom_components/roommind tests
          ruff check custom_components/roommind tests
      - name: Test
        run: pytest -q
      - name: Type check
        run: mypy custom_components/roommind
      - name: Commit result
        run: |
          rm scripts/apply_current_humidity.py
          rm .github/workflows/run-current-humidity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose RoomMind humidity on climate entities"
          git push origin HEAD:fix/homekit-current-humidity
