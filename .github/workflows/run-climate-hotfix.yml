name: Run climate hotfix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-climate-hotfix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply patch
        run: python scripts/apply_climate_hotfix_v2.py
      - name: Validate backend
        run: python -m compileall -q custom_components/roommind
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit result
        run: |
          rm .github/workflows/run-climate-hotfix.yml scripts/apply_climate_hotfix.py scripts/apply_climate_hotfix_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: honor climate master switch and add fan window toggle"
          git push origin HEAD:main
