name: Run climate state semantics fix
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply-climate-state-semantics.py'
      - '.github/workflows/run-climate-state-semantics-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python .github/scripts/apply-climate-state-semantics.py
      - name: Validate Python
        run: python -m compileall -q custom_components/roommind
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run focused tests
        run: pytest -q tests/test_climate.py tests/coordinator/test_window_pause.py
      - name: Commit result
        run: |
          rm .github/scripts/apply-climate-state-semantics.py .github/workflows/run-climate-state-semantics-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/roommind/climate.py custom_components/roommind/managers/room_climate.py tests/test_climate.py .github/scripts/apply-climate-state-semantics.py .github/workflows/run-climate-state-semantics-fix.yml
          git commit -m 'fix: align climate state with physical and auto semantics'
          git push
