name: Apply climate control hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-climate-control-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply backend and frontend patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{path}: expected block not found: {old[:80]!r}")
              text = text.replace(old, new, count)
              p.write_text(text, encoding="utf-8")

          # Backend: persist the per-room option through websocket saves.
          replace(
              "custom_components/roommind/websocket_api.py",
              '    "window_close_delay",\n    "comfort_temp",',
              '    "window_close_delay",\n    "keep_fan_only_on_window_open",\n    "comfort_temp",',
          )
          replace(
              "custom_components/roommind/websocket_api.py",
              '        vol.Optional("window_close_delay"): vol.Coerce(int),\n        vol.Optional("comfort_temp"):',
              '        vol.Optional("window_close_delay"): vol.Coerce(int),\n        vol.Optional("keep_fan_only_on_window_open"): bool,\n        vol.Optional("comfort_temp"):',
          )

          # Global Climate Control must be a real no-HVAC-command master switch.
          replace(
              "custom_components/roommind/coordinator.py",
              '        settings = store.get_settings()\n        outdoor_sensor_id = settings.get("outdoor_temp_sensor")',
              '        settings = store.get_settings()\n        climate_control_active = bool(settings.get("climate_control_active", True))\n        outdoor_sensor_id = settings.get("outdoor_temp_sensor")',
          )
          replace(
              "custom_components/roommind/coordinator.py",
              '''        # Control master devices based on aggregate room demand
        await self._async_control_master_devices(room_states, rooms, settings)
        boiler_demand = {
            area_id
            for area_id, state in room_states.items()
            if state.get("commanded_mode") == MODE_HEATING
            and self._heat_source_states.get(area_id) in ("boiler", "hybrid")
        }
        await self._boiler_manager.async_reconcile(settings, boiler_demand)
''',
              '''        # Climate Control is a true master switch for HVAC commands.
        # Monitoring, learning, history and cover automation keep running, but
        # master climates/boilers must not receive commands while it is disabled.
        if climate_control_active:
            await self._async_control_master_devices(room_states, rooms, settings)
            boiler_demand = {
                area_id
                for area_id, state in room_states.items()
                if state.get("commanded_mode") == MODE_HEATING
                and self._heat_source_states.get(area_id) in ("boiler", "hybrid")
            }
            await self._boiler_manager.async_reconcile(settings, boiler_demand)
''',
          )
          replace(
              "custom_components/roommind/coordinator.py",
              '''        # Valve protection: finish active cycles (runs every tick, cheap).
        # Pass a {eid: devices[]} map so idle_action is respected when the
        # cycle closes (idle_action="low" TRVs stay awake instead of being
        # hard-turned-off).
        await self._valve_manager.async_finish_cycles(build_rooms_devices_map(rooms))

        # Valve protection: check for stale valves (throttled)
        if self._valve_manager.should_run_cycle_check():
            await self._valve_manager.async_check_and_cycle(rooms, settings)
''',
              '''        # Valve protection can actuate climate devices, so it is also
        # subordinate to the global Climate Control master switch.
        if climate_control_active:
            # Pass a {eid: devices[]} map so idle_action is respected when the
            # cycle closes (idle_action="low" TRVs stay awake instead of being
            # hard-turned-off).
            await self._valve_manager.async_finish_cycles(build_rooms_devices_map(rooms))

            # Check for stale valves (throttled).
            if self._valve_manager.should_run_cycle_check():
                await self._valve_manager.async_check_and_cycle(rooms, settings)
''',
          )

          # Defense in depth: auxiliary AC routing must never bypass global/room control.
          replace(
              "custom_components/roommind/managers/room_climate.py",
              'from ..const import make_roommind_context',
              'from ..const import DOMAIN, make_roommind_context',
          )
          replace(
              "custom_components/roommind/managers/room_climate.py",
              '''async def async_apply_ac_auxiliary_mode(hass: HomeAssistant, room: dict) -> None:
    """Route dry/fan-only and optional AC controls only to the configured AC."""
    acs = get_ac_eids(room.get("devices", []))
''',
              '''async def async_apply_ac_auxiliary_mode(hass: HomeAssistant, room: dict) -> None:
    """Route dry/fan-only and optional AC controls only to the configured AC."""
    store = hass.data.get(DOMAIN, {}).get("store")
    if store is not None:
        settings = store.get_settings()
        if not settings.get("climate_control_active", True) or not room.get("climate_control_enabled", True):
            return

    acs = get_ac_eids(room.get("devices", []))
''',
          )

          # Direct fan/swing controls on climate.roommind_* must persist the user's
          # choice but not touch the physical AC while control is disabled.
          replace(
              "custom_components/roommind/climate.py",
              '''        await self.coordinator.hass.data[DOMAIN]["store"].async_update_room(self._area_id, {key: value})
        await self.coordinator.hass.services.async_call(
            "climate", service, {"entity_id": acs[0], service_key: value}, blocking=True
        )
''',
              '''        store = self.coordinator.hass.data[DOMAIN]["store"]
        await store.async_update_room(self._area_id, {key: value})
        settings = store.get_settings()
        room = store.get_room(self._area_id) or {}
        if not settings.get("climate_control_active", True) or not room.get("climate_control_enabled", True):
            return
        await self.coordinator.hass.services.async_call(
            "climate", service, {"entity_id": acs[0], service_key: value}, blocking=True
        )
''',
          )

          # Frontend type.
          replace(
              "frontend/src/types/index.ts",
              '  window_close_delay: number;\n  climate_mode: ClimateMode;',
              '  window_close_delay: number;\n  keep_fan_only_on_window_open?: boolean;\n  climate_mode: ClimateMode;',
          )

          # Window settings component: add default-on toggle and emit through the
          # existing sensor-changed channel.
          replace(
              "frontend/src/components/rs-sensor-section.ts",
              '  @property({ type: Number }) public windowCloseDelay = 0;\n  @property({ type: String }) public heatingSystemType = "";',
              '  @property({ type: Number }) public windowCloseDelay = 0;\n  @property({ type: Boolean }) public keepFanOnlyOnWindowOpen = true;\n  @property({ type: String }) public heatingSystemType = "";',
          )
          replace(
              "frontend/src/components/rs-sensor-section.ts",
              '''      .delay-view {
        font-size: 12px;
''',
              '''      .fan-window-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 10px;
        padding: 9px 10px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.025);
      }

      .fan-window-toggle-text {
        min-width: 0;
      }

      .fan-window-toggle-label {
        display: block;
        color: var(--primary-text-color);
        font-size: 12.5px;
        font-weight: 500;
      }

      .fan-window-toggle-hint {
        display: block;
        color: var(--secondary-text-color);
        font-size: 11px;
        line-height: 1.4;
        margin-top: 2px;
      }

      .delay-view {
        font-size: 12px;
''',
          )
          replace(
              "frontend/src/components/rs-sensor-section.ts",
              '''      </div>
      ${this.heatingSystemType === "underfloor" && this.windowOpenDelay < 300
''',
              '''      </div>
      <div class="fan-window-toggle">
        <div class="fan-window-toggle-text">
          <span class="fan-window-toggle-label">${localize("devices.keep_fan_only_window", lang)}</span>
          <span class="fan-window-toggle-hint">${localize("devices.keep_fan_only_window_hint", lang)}</span>
        </div>
        <ha-switch
          .checked=${this.keepFanOnlyOnWindowOpen}
          @change=${this._onKeepFanOnlyWindowChange}
        ></ha-switch>
      </div>
      ${this.heatingSystemType === "underfloor" && this.windowOpenDelay < 300
''',
          )
          marker = '''  private _onWindowOpenDelayChange = (e: Event) => {
'''
          p = Path("frontend/src/components/rs-sensor-section.ts")
          text = p.read_text(encoding="utf-8")
          if marker not in text:
              raise SystemExit("sensor section event marker not found")
          handler = '''  private _onKeepFanOnlyWindowChange = (e: Event) => {
    const value = (e.target as HTMLElement & { checked: boolean }).checked;
    this.dispatchEvent(
      new CustomEvent("sensor-changed", {
        detail: { key: "keep_fan_only_on_window_open", value },
        bubbles: true,
        composed: true,
      }),
    );
  };

'''
          text = text.replace(marker, handler + marker, 1)
          p.write_text(text, encoding="utf-8")

          # Room detail state, wiring and persistence.
          replace(
              "frontend/src/components/rs-room-detail.ts",
              '  @state() private _windowCloseDelay = 0;\n  @state() private _climateMode:',
              '  @state() private _windowCloseDelay = 0;\n  @state() private _keepFanOnlyOnWindowOpen = true;\n  @state() private _climateMode:',
          )
          replace(
              "frontend/src/components/rs-room-detail.ts",
              '      this._windowCloseDelay = this.config.window_close_delay ?? 0;\n      this._climateMode =',
              '      this._windowCloseDelay = this.config.window_close_delay ?? 0;\n      this._keepFanOnlyOnWindowOpen = this.config.keep_fan_only_on_window_open ?? true;\n      this._climateMode =',
          )
          replace(
              "frontend/src/components/rs-room-detail.ts",
              '      this._windowCloseDelay = 0;\n      this._climateMode = "auto";',
              '      this._windowCloseDelay = 0;\n      this._keepFanOnlyOnWindowOpen = true;\n      this._climateMode = "auto";',
          )
          # Two sensor-section instances (view + dialog).
          p = Path("frontend/src/components/rs-room-detail.ts")
          text = p.read_text(encoding="utf-8")
          old = '                    .windowCloseDelay=${this._windowCloseDelay}\n                    .heatingSystemType='
          new = '                    .windowCloseDelay=${this._windowCloseDelay}\n                    .keepFanOnlyOnWindowOpen=${this._keepFanOnlyOnWindowOpen}\n                    .heatingSystemType='
          if old not in text:
              raise SystemExit("room detail view sensor wiring not found")
          text = text.replace(old, new, 1)
          old = '            .windowCloseDelay=${this._windowCloseDelay}\n            .heatingSystemType='
          new = '            .windowCloseDelay=${this._windowCloseDelay}\n            .keepFanOnlyOnWindowOpen=${this._keepFanOnlyOnWindowOpen}\n            .heatingSystemType='
          if old not in text:
              raise SystemExit("room detail dialog sensor wiring not found")
          text = text.replace(old, new, 1)
          p.write_text(text, encoding="utf-8")
          replace(
              "frontend/src/components/rs-room-detail.ts",
              '  private _onSensorChanged(e: CustomEvent<{ key: string; value: string | string[] | number }>) {',
              '  private _onSensorChanged(e: CustomEvent<{ key: string; value: string | string[] | number | boolean }>) {',
          )
          replace(
              "frontend/src/components/rs-room-detail.ts",
              '''    } else if (key === "window_close_delay") {
      this._windowCloseDelay = value as number;
    }
''',
              '''    } else if (key === "window_close_delay") {
      this._windowCloseDelay = value as number;
    } else if (key === "keep_fan_only_on_window_open") {
      this._keepFanOnlyOnWindowOpen = value as boolean;
    }
''',
          )
          replace(
              "frontend/src/components/rs-room-detail.ts",
              '        climate_control_enabled: this._climateControlEnabled,\n        covers_auto_enabled:',
              '        climate_control_enabled: this._climateControlEnabled,\n        keep_fan_only_on_window_open: this._keepFanOnlyOnWindowOpen,\n        covers_auto_enabled:',
          )

          # Locale copy. Existing unsupported languages will continue to fall back to EN.
          for locale in ("en", "de", "fr"):
              path = Path(f"frontend/src/locales/{locale}.json")
              data = json.loads(path.read_text(encoding="utf-8"))
              devices = data.setdefault("devices", {})
              if locale == "de":
                  devices["keep_fan_only_window"] = "Nur Lüften bei offenem Fenster beibehalten"
                  devices["keep_fan_only_window_hint"] = "Heizen und Kühlen werden pausiert, aber ein Klimagerät im Nur-Lüften-Modus bleibt eingeschaltet."
              elif locale == "fr":
                  devices["keep_fan_only_window"] = "Maintenir la ventilation seule si la fenêtre est ouverte"
                  devices["keep_fan_only_window_hint"] = "Le chauffage et le refroidissement sont suspendus, mais un climatiseur en ventilation seule reste allumé."
              else:
                  devices["keep_fan_only_window"] = "Keep fan-only with open window"
                  devices["keep_fan_only_window_hint"] = "Heating and cooling pause, but an AC already in fan-only mode stays on."
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Remove this one-shot workflow from the final hotfix commit.
          Path(".github/workflows/apply-climate-control-hotfix.yml").unlink()
          PY

      - name: Validate Python syntax
        run: python -m compileall -q custom_components/roommind

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: honor climate master switch and add fan window toggle"
          git push origin HEAD:main
