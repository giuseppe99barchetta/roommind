name: Run temperature step rounding patch
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add-temperature-step-rounding.py'
      - '.github/workflows/run-temperature-step-rounding.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/add-temperature-step-rounding.py
      - name: Validate Python
        run: |
          python -m compileall -q custom_components/roommind
          python -m py_compile tests/test_climate.py tests/utils/test_temp_utils.py
      - name: Install Python test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run focused Python tests
        run: pytest -q tests/test_climate.py tests/utils/test_temp_utils.py tests/control/test_apply.py
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit result
        run: |
          rm .github/scripts/add-temperature-step-rounding.py .github/workflows/run-temperature-step-rounding.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/roommind frontend/src frontend/package-lock.json tests .github/scripts/add-temperature-step-rounding.py .github/workflows/run-temperature-step-rounding.yml
          git commit -m 'feat: support device temperature step rounding'
          git push
